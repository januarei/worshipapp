<script>
let allSongs = [];
let currentSong = null;
let transposeSteps = 0;

document.addEventListener('DOMContentLoaded', () => {
  // Ambil data lagu
  google.script.run
    .withSuccessHandler(onSongsLoaded)
    .withFailureHandler(err => console.error('Gagal ambil daftar lagu:', err))
    .getSongList();

  // Tombol search memunculkan input box
  document.getElementById('btnSearchToggle').addEventListener('click', toggleSearchBox);
  
  // Event listener untuk Filter Pencarian Teks & Dropdown Kategori
  document.getElementById('searchInput').addEventListener('input', applyFilters);
  document.getElementById('genreFilter').addEventListener('change', applyFilters);

  // Tombol Kembali
  document.getElementById('btnBack').addEventListener('click', showListView);
  document.getElementById('btnBackBottom').addEventListener('click', showListView);

  // Modal Gambar
  document.getElementById('songThumb').addEventListener('click', () => openImageModal(currentSong.imageUrl));
  document.getElementById('imageModal').addEventListener('click', closeImageModal);
  document.getElementById('modalClose').addEventListener('click', closeImageModal);
});

function toggleSearchBox() {
  const box = document.getElementById('searchBox');
  box.classList.toggle('active');
  if (box.classList.contains('active')) document.getElementById('searchInput').focus();
}

function onSongsLoaded(songs) {
  // Urut ascending berdasarkan judul (A→Z)
  allSongs = [...songs].sort((a, b) =>
    a.judul.localeCompare(b.judul, 'id', { sensitivity: 'base' }));
  
  // Ambil semua genre yang ada dari Google Sheet, hapus duplikat & abaikan yang kosong
  const genres = [...new Set(allSongs.map(s => s.genre).filter(Boolean))];
  genres.sort(); // Urutkan nama genre sesuai abjad
  
  // Masukkan genre ke dalam dropdown
  const genreSelect = document.getElementById('genreFilter');
  genreSelect.innerHTML = '<option value="ALL">All</option>'; // Reset opsi
  genres.forEach(g => {
    const opt = document.createElement('option');
    opt.value = g;
    opt.textContent = g;
    genreSelect.appendChild(opt);
  });

  renderList(allSongs);
}

// Fungsi menggabungkan Filter Judul & Filter Genre
function applyFilters() {
  const kw = document.getElementById('searchInput').value.toLowerCase();
  const selectedGenre = document.getElementById('genreFilter').value;

  const filtered = allSongs.filter(s => {
    const matchKw = s.judul.toLowerCase().includes(kw);
    const matchGenre = (selectedGenre === "ALL") || (s.genre === selectedGenre);
    return matchKw && matchGenre;
  });

  renderList(filtered);
}

function renderList(songs) {
  const ul = document.getElementById('songList');
  const empty = document.getElementById('emptyState');
  ul.innerHTML = '';

  let pinnedSongs = songs.filter(s => s.pinned);
  const restSongs = songs.filter(s => !s.pinned);

  // Logika urutan lagu yang di-PIN berdasarkan kolom urutan (kolom I)
  pinnedSongs.sort((a, b) => {
    const urutanA = parseInt(a.urutan) || 999;
    const urutanB = parseInt(b.urutan) || 999;
    return urutanA - urutanB;
  });

  empty.style.display = (pinnedSongs.length + restSongs.length) ? 'none' : 'block';

  if (pinnedSongs.length) {
    ul.appendChild(sectionLabel('📌 Ibadah Minggu Ini'));
    pinnedSongs.forEach(s => ul.appendChild(buildSongItem(s)));
  }

  if (restSongs.length) {
    if (pinnedSongs.length) ul.appendChild(sectionLabel('Semua Lagu'));
    restSongs.forEach(s => ul.appendChild(buildSongItem(s)));
  }
}

function sectionLabel(text) {
  const li = document.createElement('li');
  li.className = 'list-section-label';
  li.textContent = text;
  return li;
}

function buildSongItem(s) {
  const li = document.createElement('li');
  const thumbSrc = s.imageUrl || '';

  li.innerHTML = `
    ${thumbSrc ? `<img class="thumb" src="${thumbSrc}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'thumb'}));">` : `<div class="thumb"></div>`}
    <span class="text-col">
      <span class="title">${s.judul}</span>
      <span class="sub">${s.author} • Key ${s.key}</span>
    </span>`;

  li.addEventListener('click', () => openSong(s.id));
  return li;
}

function openSong(id) {
  google.script.run
    .withSuccessHandler(onSongLoaded)
    .withFailureHandler(err => console.error('Gagal ambil detail lagu:', err))
    .getSongById(id);
}

function onSongLoaded(song) {
  currentSong = song;
  transposeSteps = 0;
  document.getElementById('songTitle').textContent = song.judul;

  const thumb = document.getElementById('songThumb');
  if (song.imageUrl) {
    thumb.src = song.imageUrl;
    thumb.style.display = 'block';
  } else {
    thumb.removeAttribute('src');
    thumb.style.display = 'none';
  }

  // Tampilan Author, Genre, dan Tombol Mic
  document.getElementById('songMeta').innerHTML = `
    <div>Author: ${song.author}</div>
    <div class="genre-row">
      <span>Genre: ${song.genre}</span>
      <button id="btnVocalMode" class="btn-vocal" title="Mode Singer (Hanya Lirik)">🎤</button>
    </div>
  `;

  // Event listener tombol Mode Vokal/Mic
  document.getElementById('btnVocalMode').addEventListener('click', function() {
    this.classList.toggle('active');
    document.getElementById('chordSheet').classList.toggle('compact');
  });

  // Reset tampilan lirik ke default (bukan compact) saat memuat lagu baru
  document.getElementById('chordSheet').classList.remove('compact');

  buildKeyButtons(song.key);
  renderChordSheet();
  showDetailView();
}

function renderChordSheet() {
  const lines = currentSong.lyrics.split('\n');
  let html = '';
  lines.forEach(line => {
    if (line.trim() === '') { html += '<br>'; return; }
    if (!line.includes('[')) {
      html += `<span class="section-title">${line}</span>`;
      return;
    }
    html += renderLine(transposeLine(line, transposeSteps)) + '<br>';
  });
  document.getElementById('chordSheet').innerHTML = html;
}

function renderLine(line) {
  let html = '';
  const firstBracket = line.indexOf('[');
  if (firstBracket > 0) {
    html += pairHtml('', line.slice(0, firstBracket));
  }
  const regex = /\[([^\]]+)\]([^\[]*)/g;
  let m;
  while ((m = regex.exec(line)) !== null) {
    html += pairHtml(m[1], m[2] || '\u00A0');
  }
  return html;
}

function pairHtml(chord, lyric) {
  return `<span class="pair"><span class="chord">${chord}</span><span class="lyric">${lyric}</span></span>`;
}

const SHARPS = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLATS  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];

function transposeLine(line, steps) {
  if (steps === 0) return line;
  return line.replace(/\[([^\]]+)\]/g, (m, chord) => '[' + transposeChord(chord, steps) + ']');
}

function transposeChord(chord, steps) {
  if (!steps) return chord;
  const m = chord.match(/^([A-G])(#|b)?(.*)$/);
  if (!m) return chord;
  const [, root, acc, rest] = m;
  const noteName = root + (acc || '');
  let idx = SHARPS.indexOf(noteName);
  if (idx === -1) idx = FLATS.indexOf(noteName);
  if (idx === -1) return chord;

  let bassSuffix = '';
  let mainRest = rest;
  const bassMatch = rest.match(/\/([A-G])(#|b)?/);
  if (bassMatch) {
    mainRest = rest.slice(0, bassMatch.index);
    const bIdx = SHARPS.indexOf(bassMatch[1] + (bassMatch[2] || '')) >= 0
      ? SHARPS.indexOf(bassMatch[1] + (bassMatch[2] || ''))
      : FLATS.indexOf(bassMatch[1] + (bassMatch[2] || ''));
    const newBassIdx = ((bIdx + steps) % 12 + 12) % 12;
    bassSuffix = '/' + SHARPS[newBassIdx] + rest.slice(bassMatch.index + bassMatch[0].length);
  }

  const newIdx = ((idx + steps) % 12 + 12) % 12;
  return SHARPS[newIdx] + mainRest + bassSuffix;
}

const ALL_KEYS = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

function buildKeyButtons(originalKeyStr) {
  const container = document.getElementById('keyButtons');
  container.innerHTML = '';
  const baseIdx = getNoteIndex(originalKeyStr);
  transposeSteps = 0;

  ALL_KEYS.forEach((note, idx) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = note;
    if (idx === baseIdx) btn.classList.add('active');
    btn.addEventListener('click', () => selectKey(note, idx));
    container.appendChild(btn);
  });
}

function selectKey(note, idx) {
  const baseIdx = getNoteIndex(currentSong.key);
  transposeSteps = ((idx - baseIdx) % 12 + 12) % 12;

  document.querySelectorAll('#keyButtons button').forEach(b =>
    b.classList.toggle('active', b.textContent === note));

  renderChordSheet();
}

function getNoteIndex(keyStr) {
  const m = String(keyStr).match(/^([A-G])(#|b)?/);
  if (!m) return 0;
  const note = m[1] + (m[2] || '');
  let idx = SHARPS.indexOf(note);
  if (idx === -1) idx = FLATS.indexOf(note);
  return idx === -1 ? 0 : idx;
}

function openImageModal(url) {
  if (!url) return;
  document.getElementById('modalImg').src = url;
  document.getElementById('imageModal').classList.add('active');
}
function closeImageModal(e) {
  if (e.target.id === 'modalImg') return;
  document.getElementById('imageModal').classList.remove('active');
}

function showListView() {
  document.getElementById('view-list').classList.add('active');
  document.getElementById('view-detail').classList.remove('active');
}
function showDetailView() {
  document.getElementById('view-list').classList.remove('active');
  document.getElementById('view-detail').classList.add('active');
  window.scrollTo(0, 0);
}
</script>
